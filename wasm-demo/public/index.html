<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Sylius Stack, in the browser</title>
    <style>
        :root {
            color-scheme: light dark;
            background: light-dark(#fff, #121318);
            color: light-dark(#1c1d23, #e2e3ea);
            font: 1rem/1.5 system-ui, sans-serif;
        }
        body {
            max-width: 40rem;
            margin: 0 auto;
            padding: 4rem 1.25rem;
            text-align: center;
        }
        .spinner {
            width: 2.5rem;
            height: 2.5rem;
            margin: 2rem auto;
            border: 0.25rem solid light-dark(#d9dbe4, #363948);
            border-top-color: #22b99a;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        small {
            color: light-dark(#5e6272, #9a9eb0);
        }
    </style>
</head>
<body>
    <!-- Shown until the service worker answers, with the application -->
    <h1>Sylius Stack, in the browser</h1>
    <p>PHP, compiled to WebAssembly, runs Symfony, Doctrine and SQLite in a service worker: no server runs PHP.</p>
    <div class="spinner"></div>
    <p id="message">Starting PHP in the service worker…</p>
    <p><small>Log in with <code>admin@example.com</code> / <code>admin</code>.</small></p>

    <script type="module">
        import { startServiceWorker } from './build/php-web.mjs';

        const message = document.getElementById('message');

        try {
            await startServiceWorker();
            message.textContent = 'Booting Symfony…';
            // The service worker answers now: with Symfony. On the start page,
            // the admin panel; as 404.html, on GitHub Pages, the page asked for
            if (new URL('./', document.baseURI).href === location.href) {
                location.replace('./admin');
            } else {
                location.reload();
            }
        } catch (error) {
            document.querySelector('.spinner').remove();
            message.textContent = `This browser can not run PHP in a service worker: ${error.message}`;
        }
    </script>
</body>
</html>
