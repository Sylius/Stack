doctrine:
    dbal:
        # SQLite: no database server, one file per environment.
        url: 'sqlite:///%kernel.project_dir%/var/data_%kernel.environment%.db'
        profiling_collect_backtrace: '%kernel.debug%'
    orm:
        validate_xml_mapping: true
        naming_strategy: doctrine.orm.naming_strategy.underscore
        auto_mapping: true
        mappings:
            App:
                type: attribute
                is_bundle: false
                dir: '%kernel.project_dir%/src/Entity'
                prefix: 'TestApplication\Sylius\ShadcnAdminUi\Entity'
