name: Demo

# The demo application, with PHP as WebAssembly, on GitHub Pages: see
# wasm-demo/castor.php. GitHub Pages must deploy from GitHub Actions, in the
# settings of the repository.

on:
    push:
        # demo/php-wasm: to try it on a fork, before it is merged
        branches: [ main, demo/php-wasm ]
    workflow_dispatch: ~

permissions:
    contents: read
    pages: write
    id-token: write

# One deployment at a time, the last push wins
concurrency:
    group: pages
    cancel-in-progress: true

jobs:
    deploy:
        runs-on: ubuntu-latest
        name: "Build and deploy the demo"
        environment:
            name: github-pages
            url: ${{ steps.deployment.outputs.page_url }}
        env:
            COMPOSER_ROOT_VERSION: "dev-main"
        defaults:
            run:
                working-directory: wasm-demo
        steps:
            -   name: "Checkout"
                uses: actions/checkout@v4

            -   name: "Setup PHP"
                uses: shivammathur/setup-php@v2
                with:
                    php-version: "8.5"
                    tools: 'castor, composer:v2, flex'
                    coverage: none

            -   name: "Setup node"
                uses: actions/setup-node@v4
                with:
                    node-version: 24

            -   name: "Install PHP dependencies"
                run: composer install --no-interaction --no-scripts
                working-directory: .

            -   name: "Install php-wasm-builder"
                run: castor castor:composer install --no-interaction

            -   name: "Configure GitHub Pages"
                id: pages
                uses: actions/configure-pages@v5

            # The cache of the layers needs the docker-container driver of
            # buildx, and the runtime token and URLs of GitHub Actions
            -   name: "Setup buildx"
                uses: docker/setup-buildx-action@v3

            -   name: "Expose the GitHub Actions runtime"
                uses: crazy-max/ghaction-github-runtime@v3

            -   name: "Build the demo"
                run: >
                    castor demo:build
                    --base-path='${{ steps.pages.outputs.base_path }}/'
                    --set='*.cache-from=type=gha'
                    --set='*.cache-to=type=gha,mode=max,ignore-error=true'

            -   name: "Check the pages of the admin panel"
                run: castor demo:check

            # Only demo:check runs PHP in node
            -   name: "Remove the build for node"
                run: rm public/build/php-node.*

            -   name: "Upload the demo"
                uses: actions/upload-pages-artifact@v3
                with:
                    path: wasm-demo/public

            -   name: "Deploy to GitHub Pages"
                id: deployment
                uses: actions/deploy-pages@v4
