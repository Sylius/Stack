name: Continuous Integration

on:
    pull_request:
        paths-ignore:
            - "docs/**"
            - "*.md"
    workflow_dispatch: ~
    workflow_call: ~

jobs:
    static-checks:
        runs-on: ubuntu-latest
        strategy:
            fail-fast: false
            matrix:
                php: [ "8.2", "8.3" ]
                postgres: [ "16" ]
                symfony: [ "^6.4", "^7.4" ]
                include:
                    - php: '8.4'
                      postgres: "14.6"
                      symfony: "^8.1"
        name: "PHP ${{ matrix.php }} / Symfony ${{ matrix.symfony }}"
        env:
            APP_ENV: test
            COMPOSER_ROOT_VERSION: "dev-main"
            DATABASE_URL: "pgsql://postgres:postgres@127.0.0.1/sylius_stack?charset=utf8&serverVersion=${{ matrix.postgres }}"
        services:
            postgres:
                image: postgres:${{ matrix.postgres }}
                env:
                    POSTGRES_DB: sylius_stack
                    POSTGRES_USER: postgres
                    POSTGRES_PASSWORD: postgres
                ports:
                    - 5432:5432
                options: >-
                    --health-cmd="pg_isready -U postgres"
                    --health-interval=10s
                    --health-timeout=5s
                    --health-retries=5            
        steps:
            -   name: "Checkout"
                uses: actions/checkout@v3

            -   name: "Setup PHP"
                uses: shivammathur/setup-php@v2
                with:
                    php-version: "${{ matrix.php }}"
                    tools: 'symfony, composer:v2, flex'
                    coverage: none

            -   name: Shutdown default MySQL
                run: sudo service mysql stop

            -   name: "Restrict packages' versions"
                run: composer config extra.symfony.require "${{ matrix.symfony }}"

            -   name: Get Composer cache directory
                id: composer-cache
                run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

            -   name: "Setup cache"
                uses: actions/cache@v3
                with:
                    path: |
                        ${{ steps.composer-cache.outputs.dir }}
                    key: ${{ github.run_id }}-${{ runner.os }}-${{ hashFiles('composer.json') }}-symfony-${{ matrix.symfony }}

            -   name: "Install dependencies"
                run: composer update --no-interaction --no-scripts

            -   name: "Validate composer.json"
                run: composer validate --strict --no-check-version

            -   name: "Check for security vulnerabilities"
                run: symfony security:check

            -   name: "Validate coding standard"
                run: vendor/bin/ecs check

            -   name: "Validate Container"
                run: bin/console lint:container

            -   name: Validate Package versions
                run: vendor/bin/monorepo-builder validate

            -   name: Run PHPStan
                run: vendor/bin/phpstan analyse

            -   name: Create Testing database
                run: |
                    bin/console doctrine:database:create
                    bin/console doctrine:schema:create
                    
            -   name: "Install & compile assets"
                run: |
                    bin/console importmap:install
                    bin/console tailwind:build
                    bin/console asset-map:compile

            -   name: Run PHPUnit
                run: vendor/bin/phpunit

            -   name: Run Translations Test Suite with PHPUnit
                run: |
                    APP_LOCALE=fr vendor/bin/phpunit --testsuite="TranslationsTestSuite"

    packages:
        runs-on: ubuntu-latest
        strategy:
            fail-fast: false
            matrix:
                package: [ "AdminUi", "BootstrapAdminUi", "ShadcnAdminUi", "TwigExtra", "TwigHooks", "UiTranslations" ]
                versions:
                    - { php: "8.2", symfony: "^6.4" }
                    - { php: "8.2", symfony: "^7.4" }
                    - { php: "8.3", symfony: "^6.4" }
                    - { php: "8.3", symfony: "^7.4" }
                    - { php: "8.4", symfony: "^8.1" }
        name: "${{ matrix.package }} / PHP ${{ matrix.versions.php }} / Symfony ${{ matrix.versions.symfony }}"
        env:
            APP_ENV: test
            COMPOSER_ROOT_VERSION: "dev-main"
        defaults:
            run:
                working-directory: src/${{ matrix.package }}
        steps:
            -   name: "Checkout"
                uses: actions/checkout@v3

            -   name: "Setup PHP"
                uses: shivammathur/setup-php@v2
                with:
                    php-version: "${{ matrix.versions.php }}"
                    tools: 'composer:v2, flex'
                    coverage: none

            -   name: "Restrict packages' versions"
                run: |
                    composer config --no-plugins allow-plugins.symfony/runtime true
                    composer config extra.symfony.require "${{ matrix.versions.symfony }}"

            -   name: Get Composer cache directory
                id: composer-cache
                run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

            -   name: "Setup cache"
                uses: actions/cache@v3
                with:
                    path: |
                        ${{ steps.composer-cache.outputs.dir }}
                    key: ${{ github.run_id }}-${{ runner.os }}-${{ matrix.package }}-${{ hashFiles(format('src/{0}/composer.json', matrix.package)) }}-symfony-${{ matrix.versions.symfony }}

            -   name: "Install dependencies"
                run: composer update --no-interaction --no-scripts

            -   name: "Build the assets"
                if: matrix.package == 'ShadcnAdminUi'
                run: |
                    php tests/Functional/.application/bin/console importmap:install
                    php tests/Functional/.application/bin/console tailwind:build

            -   name: Run PHPUnit
                run: vendor/bin/phpunit

            -   name: Setup Node.js
                if: (matrix.package == 'BootstrapAdminUi' || matrix.package == 'ShadcnAdminUi') && matrix.versions.php == '8.3' && matrix.versions.symfony == '^7.4'
                uses: actions/setup-node@v4
                with:
                    node-version: '24'

            -   name: Run JavaScript tests
                if: (matrix.package == 'BootstrapAdminUi' || matrix.package == 'ShadcnAdminUi') && matrix.versions.php == '8.3' && matrix.versions.symfony == '^7.4'
                run: |
                    yarn install --frozen-lockfile --non-interactive
                    yarn test
